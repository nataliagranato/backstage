# =============================================================================
# Docker Compose — Backstage + PostgreSQL
# =============================================================================
# Copia o .env.example para .env e preencha as variáveis antes de rodar.
#
# Comandos:
#   docker compose up -d          # sobe todos os serviços
#   docker compose logs -f        # acompanha os logs
#   docker compose down -v        # derruba e remove os volumes
# =============================================================================

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: backstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
      POSTGRES_DB: ${POSTGRES_DB:-backstage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backstage} -d ${POSTGRES_DB:-backstage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backstage-net

  # ─── Backstage ──────────────────────────────────────────────────────────────
  backstage:
    build:
      context: .
      dockerfile: Dockerfile
    image: backstage:latest
    container_name: backstage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- App ---
      APP_CONFIG_app_baseUrl: http://localhost:7007
      APP_CONFIG_backend_baseUrl: http://localhost:7007

      # --- PostgreSQL ---
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}

      # --- Integrações ---
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      # --- Auth ---
      BACKEND_SECRET: ${BACKEND_SECRET:-change-me-in-production}
    ports:
      - "7007:7007"
    networks:
      - backstage-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: backstage_postgres_data

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  backstage-net:
    name: backstage-net
    driver: bridge
