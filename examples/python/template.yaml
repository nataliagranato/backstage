apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python
  title: Python
  description: Create the foundation of a Python API project by describing what you need.
spec:
  owner: group:tech-preta
  type: service

  parameters:
    - title: Project details
      required:
        - name
        - prompt
      properties:
        name:
          title: Repository name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          ui:autofocus: true
        prompt:
          title: What should your API do?
          type: string
          description: e.g. "A FastAPI service to calculate delivery routes."
          ui:widget: textarea
          ui:options:
            rows: 5

  steps:
    - id: ai-generate
      name: Generating code with AI
      action: verboo:generate:python
      input:
        prompt: ${{ parameters.prompt }}

    - id: publish
      name: Publishing to GitHub
      action: publish:github
      input:
        description: Python project generated by AI.
        # host and owner are fixed by the Tech-Preta integration, not exposed
        # to the user
        repoUrl: github.com?repo=${{ parameters.name }}&owner=Tech-Preta
        defaultBranch: main

    - id: register
      name: Registering in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
